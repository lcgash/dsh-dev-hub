name: standalone-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: standalone server + fake Claude E2E
        shell: bash
        run: |
          status=0
          node --test test/onboarding.test.mjs test/standalone-server.test.mjs test/standalone-e2e.test.mjs 2>&1 | tee standalone-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## standalone tests failed'
              echo '```'
              tail -160 standalone-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::standalone tests failed; see the job summary for the full tail"
          fi
          exit "$status"
