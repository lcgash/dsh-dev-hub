name: standalone-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: standalone server + fake Claude E2E
        run: node --test test/onboarding.test.mjs test/standalone-server.test.mjs test/standalone-e2e.test.mjs
